name: validate-catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate modules.json
        run: node scripts/validate.mjs modules.json

      - name: Validate schema.json is parseable JSON
        run: node -e "JSON.parse(require('fs').readFileSync('schema.json','utf8'))"